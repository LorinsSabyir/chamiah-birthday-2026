<div class="app-shell" [class.landing-shell]="router.url.split('?')[0] === '/'">
  @if (router.url.split('?')[0] !== '/') {
  <header class="site-header" [class.nav-hidden]="navHidden">
    <a class="brand font-display" routerLink="/" aria-label="Birthday surprise home">for you <span>♡</span></a>
    <nav class="mobile-nav" aria-label="Birthday pages">
        <a class="nav-link" routerLink="/" routerLinkActive="nav-link-active" [routerLinkActiveOptions]="{ exact: true }">Welcome</a>
        <a class="nav-link" routerLink="/things-i-love" routerLinkActive="nav-link-active">What I Love</a>
        <a class="nav-link" routerLink="/memories" routerLinkActive="nav-link-active">Memories</a>
        <a class="nav-link" routerLink="/letter" routerLinkActive="nav-link-active">Letter</a>
        <a class="nav-link" routerLink="/wishes" routerLinkActive="nav-link-active">Wishes</a>
    </nav>
  </header>
  }
  <main class="page-host">
    <router-outlet />
  </main>
  @if (router.url.split('?')[0] !== '/') {
    <footer class="site-footer">made with <span aria-label="love">♥</span> for your favorite person</footer>
  }
</div>
